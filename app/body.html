<script>
const CONTENT = /*__CONTENT__*/;

/* ---------- Catalogue ---------- */
const SK = {
  o1:["Quadratics & critical points","Q"], o2:["Line search & Wolfe","α"], o3:["Newton, quasi-Newton & CG","N"], o4:["Trust region","Δ"],
  o5:["Constraints & KKT","λ"], o6:["Penalty, barrier & SQP","μ"], o7:["Surrogate modeling","ŷ"], o8:["Convexity & gradients","∇"],
  o9:["Multi-objective & gradient-free","≺"], o10:["MDO & design of experiments","N²"],
  f1:["Master equation & constraint diagram","T/W"], f2:["Performance","V"], f3:["V-n diagram","n"], f4:["Propulsion","T-s"],
  f5:["Aerodynamics","Γ"], f6:["Rotorcraft & unusual vehicles","A"], f7:["Aeroelasticity & sizing","W₀"], f8:["Equations of motion","γ"],
  f9:["Drag buildup & high lift","C_D"], f10:["Stability & control","SM"],
  s1:["Kinematics","F"], s2:["Stress, balance & objectivity","σ"], s3:["Constitutive laws","C"], s4:["Plane problems & Airy","φ"],
  s5:["Vessels & Lamé","p"], s6:["Beams & sections","I"], s7:["Shear flow & torsion","q"], s8:["Energy methods & Ritz","U"],
  s9:["Stability","Π"], s10:["Indeterminate beams & springs","k"], s11:["Curved beams, frames & multi-material","R"],
  s12:["Finite deformation & hyperelasticity","W"], s13:["Balance laws & descriptions","ρ"], s14:["Columns & imperfections","Pcr"],
  s15:["Thermal & composite stiffness","αΔT"],
  o11:["Classic slips: optimization","!"], f11:["Classic slips: aircraft design","!"], s16:["Classic slips: solid mechanics","!"], s17:["Classic slips: structures & stability","!"]
};
const EXAMS = [
  {id:"SDO", name:"Fixed wing vehicles",
   chairs:[["Optimization theory",["o1","o2","o3","o4","o5","o6","o8","o11"]],["Applied optimization",["o5","o7","o9","o10"]],["Aircraft design",["f1","f2","f3","f4","f5","f6","f7","f8","f9","f10","f11"]]],
   units:[
    {id:"u1",cn:"AE 6310",name:"Unconstrained optimization",skills:["o1","o8","o2","o3","o4"]},
    {id:"u2",cn:"AE 6310",name:"Constrained & applied optimization",skills:["o5","o6","o7","o9","o10"]},
    {id:"u3",cn:"AE 6343",name:"Performance & sizing",skills:["f8","f2","f1","f3","f7"]},
    {id:"u4",cn:"AE 6343",name:"Aerodynamics, propulsion & control",skills:["f5","f9","f4","f6","f10"]},
    {id:"u10",cn:"Archive",name:"Classic slips from past boards",skills:["o11","f11"]}]},
  {id:"SMM", name:"Structures & materials",
   chairs:[["Solid mechanics",["s1","s13","s2","s3","s12","s4","s5","s15","s16"]],["Structural analysis",["s6","s10","s11","s7","s8","s17"]],["Stability",["s9","s14"]]],
   units:[
    {id:"u5",cn:"AE 6114",name:"Kinematics, stress & balance",skills:["s1","s13","s2","s12"]},
    {id:"u6",cn:"AE 6114",name:"Elasticity & boundary value problems",skills:["s3","s15","s4","s5"]},
    {id:"u7",cn:"AE 6115",name:"Beams, sections & torsion",skills:["s6","s7","s11"]},
    {id:"u8",cn:"AE 6115",name:"Energy methods & indeterminacy",skills:["s8","s10"]},
    {id:"u9",cn:"AE 6100",name:"Structural stability",skills:["s9","s14"]},
    {id:"u11",cn:"Archive",name:"Classic slips from past boards",skills:["s16","s17"]}]}
];
const SKILL={}, UNIT={}, ORDER=[];
EXAMS.forEach(e=>e.units.forEach(u=>{UNIT[u.id]=Object.assign({exam:e.id},u);u.skills.forEach(id=>{SKILL[id]={id,name:SK[id][0],glyph:SK[id][1],cn:u.cn,unit:u.id,exam:e.id};ORDER.push(id)})}));
const QS=CONTENT.questions, QBY={}, QID={};
QS.forEach(q=>{(QBY[q.skill] ||= []).push(q);QID[q.id]=q});
const BOARDS=CONTENT.boards, FIGS=CONTENT.figs, FBY={};
FIGS.forEach((f,i)=>{f.i=i;(FBY[f.skill] ||= []).push(f)});
const MAXLV=5, LESSON_N=8, MAXM=5, REGEN_MIN=30, CP_N=15, CP_PASS=0.8, LIGHT_S=90, CHAL_N=10;
const INTERVALS=[0,1,3,7,14,30];
const PLAYBOOK=[
  ["Name the method first.","Say which method you will use and why before any algebra, for example \"I will set up the KKT conditions\" or \"this is a two-DOF energy problem\"."],
  ["State your assumptions out loud.","Small strain, linear elastic, thin wall, quasi-static, point mass: say each one as you use it."],
  ["Plan the board in columns.","One column per stage, left to right, so the examiner can follow without asking."],
  ["Stand beside your work.","Write, then step aside so the examiner sees the board."],
  ["Check before you box.","Run a units check and a limiting case on every final expression."],
  ["Answer the question asked, then stop.","A short, complete answer invites the next question; extra material invites a detour."],
  ["Name a broken assumption.","When a result contradicts the premise (a thin wall coming out thick), stop and say which assumption the result violates."],
  ["Let the question finish.","Pause for a beat after the examiner stops talking, then answer."],
  ["Hold ground you own.","When you are confident, restate your reasoning calmly; concede only to a reason."],
  ["Narrate onto the page.","The oral is graded on reasoning, so say each step as you write it."],
  ["Write the quantity they asked for.","Finish the line: box the stress, the load or the step they asked for, then stop."],
  ["Switch notation on request.","Be ready to move between summation and vector form mid-derivation."]
];

/* ---------- Dates & random ---------- */
const pad=n=>String(n).padStart(2,"0");
const dayKey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number);return dayKey(new Date(y,m-1,d+n))};
const diffDays=(a,b)=>{const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const weekKey=()=>{const t=new Date();t.setDate(t.getDate()-((t.getDay()+6)%7));return dayKey(t)};
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuffle=(a,r=Math.random)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- State ---------- */
const fresh=()=>({v:2, exams:["SDO","SMM"], examDate:"", goal:30, setup:false, unlimited:false,
  xpDays:{}, streak:0, last:"", best:0, markers:MAXM, mAt:Date.now(),
  lv:{}, cards:{}, cp:{}, boards:[], mocks:[], light:0, chal:{}, quests:{}, weekXp:0, week:weekKey(), lessons:0, derivs:{}, fc:{}, sched:[], showDate:false, stars:[], freezes:0, sound:false});
let S=fresh();
let store=null, uid=null, saveMode="none", userNS=null, sampleFn=null;
/* Progress is kept per account on each device ("qd-state:<user id>"), plus an anonymous slot for use without an account. */
let LSKEY=window.QL_UID?"qd-state:"+window.QL_UID:"qd-state";
function lsGet(k){try{const r=localStorage.getItem(k||LSKEY);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
function normalize(o){const s=Object.assign(fresh(),o||{});if(s.week!==weekKey()){s.week=weekKey();s.weekXp=0}return s}
let saving=Promise.resolve(), dirty=false, saveTimer=null;
/* Every save stamps S.ts. Local storage is written at once; the account copy is written at most about once a second,
   and flushed when the page is hidden or closed, so a phone that sleeps mid-lesson keeps its progress. */
function save(){
  S.ts=Date.now(); lsSet(); if(saveMode!=="db") return; dirty=true;
  clearTimeout(saveTimer); saveTimer=setTimeout(flushSave,1000);
}
function flushSave(){
  clearTimeout(saveTimer); if(saveMode!=="db"||!dirty) return saving;
  saving=saving.then(async()=>{ if(!dirty) return; dirty=false;
    try{ await store.doc("data/users/"+uid+"/state").set(JSON.parse(JSON.stringify(S))) }
    catch(e){ dirty=true; if(e&&e.code==="invalid_argument"){saveMode="local";toast("Progress is saving on this device only.")} } });
  return saving;
}
addEventListener("pagehide",()=>{try{flushSave()}catch(e){}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){try{flushSave()}catch(e){}}else{try{pullRemote()}catch(e){}}});
/* When the app comes back to the foreground, take a newer copy from another device. */
async function pullRemote(){
  if(saveMode!=="db"||L||M||dirty) return;
  try{const snap=await store.doc("data/users/"+uid+"/state").get(); if(!snap.exists) return; const r=snap.data();
    if((r.ts||0)>(S.ts||0)+1000){S=normalize(r);lsSet();applyTheme&&applyTheme();render();toast("Synced from your other device.")}}catch(e){}
}
async function postLeague(){
  if(saveMode!=="db") return;
  const c=S.chal[weekKey()]||{};
  try{ await store.doc("league/"+uid).set({week:S.week,xp:S.weekXp,streak:liveStreak(),exams:S.exams,chal:c,at:Date.now(),showDate:!!(S.showDate&&S.examDate),examDate:S.showDate?S.examDate:""}) }catch(e){}
}

function tickMarkers(){ if(S.markers>=MAXM){S.mAt=Date.now();return} const g=Math.floor((Date.now()-S.mAt)/(REGEN_MIN*60e3)); if(g>0){S.markers=Math.min(MAXM,S.markers+g);S.mAt+=g*REGEN_MIN*60e3} }
const nextMarkerMin=()=>Math.max(1,Math.ceil((S.mAt+REGEN_MIN*60e3-Date.now())/60e3));
function liveStreak(){ if(!S.last) return 0; const g=diffDays(S.last,dayKey()); return g<=1||(g===2&&(S.freezes||0)>0)?S.streak:0 }
function award(xp){
  const t=dayKey(); if(S.week!==weekKey()){S.week=weekKey();S.weekXp=0}
  const before=S.xpDays[t]||0; S.xpDays[t]=before+xp; S.weekXp+=xp;
  if(before<S.goal&&S.xpDays[t]>=S.goal){setTimeout(()=>{toast("Daily goal met.");sfx("goal")},900)}
  if(S.last!==t){const g=S.last?diffDays(S.last,t):99;
    if(g===1) S.streak++;
    else if(g===2&&(S.freezes||0)>0){S.freezes--;S.streak++;setTimeout(()=>toast("A streak freeze covered yesterday. Streak safe."),1500)}
    else S.streak=1;
    S.last=t; S.best=Math.max(S.best,S.streak);
    if(S.streak%7===0&&(S.freezes||0)<2){S.freezes=(S.freezes||0)+1;setTimeout(()=>toast("Seven more days. You earned a streak freeze."),2200)}}
  const k=Object.keys(S.xpDays).sort(); while(k.length>60) delete S.xpDays[k.shift()];
  questTick("xp",xp);
}
const inScope=sk=>S.exams.includes(SKILL[sk].exam);
function due(){const t=dayKey();return Object.entries(S.cards).filter(([id,c])=>QID[id]&&inScope(QID[id].skill)&&c.due<=t).map(([id])=>id)}
function grade(id,ok){
  const c=S.cards[id]||{b:0,due:dayKey(),n:0,m:0};
  c.n++; if(ok){c.b=Math.min(INTERVALS.length-1,c.b+1)}else{c.b=0;c.m++}
  c.due=addDays(dayKey(),ok?INTERVALS[c.b]:1); S.cards[id]=c;
}

/* ---------- Quests ---------- */
const QUESTS={
  xp:      d=>({t:`Earn ${S.goal} XP`, need:S.goal}),
  lesson:  d=>({t:"Finish 2 lessons", need:2}),
  sharp:   d=>({t:"Finish a lesson at 90% or better", need:1}),
  review:  d=>({t:"Finish a drill round", need:1}),
  board:   d=>({t:"Answer an oral board question", need:1}),
  light:   d=>({t:"Score 8 or more in a lightning round", need:1}),
  num:     d=>({t:"Get 3 numeric questions right", need:3})
};
function todaysQuests(){const t=dayKey();const r=rng(hash(t));const pool=shuffle(["lesson","sharp","review","board","light","num"],r);return ["xp",pool[0],pool[1]]}
function questTick(kind,n=1){
  const t=dayKey(); const q=S.quests[t] ||= {}; const list=todaysQuests();
  if(!list.includes(kind)) return;
  const need=QUESTS[kind]().need; const before=q[kind]||0; q[kind]=Math.min(need,before+n);
  if(before<need&&q[kind]>=need&&kind!=="xp"){ S.xpDays[t]=(S.xpDays[t]||0)+10; S.weekXp+=10; toast("Quest done: +10 XP") }
  for(const k of Object.keys(S.quests)) if(diffDays(k,t)>3) delete S.quests[k];
}

/* ---------- Utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const ICON={x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
function figHTML(f){return `<figure class="fig"><div class="svgw">${f.svg}</div><figcaption><b>${esc(f.title)}.</b> ${esc(f.caption)}</figcaption></figure>`}
function setTab(t){TAB=t;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===t));render();window.scrollTo(0,0)}

/* ---------- Tray & tabs ---------- */
function renderTray(){
  tickMarkers(); $("#sStreak").textContent=liveStreak(); $("#sXp").textContent=S.weekXp;
  const m=$("#sMarkers"); m.classList.toggle("inf",S.unlimited);
  m.innerHTML=Array.from({length:MAXM},(_,i)=>`<i class="${S.unlimited||i<S.markers?"":"off"}"></i>`).join("");
  m.title=S.unlimited?"Unlimited markers":`${S.markers} of ${MAXM} markers`; m.setAttribute("aria-label",m.title);
  const d=due().length; $("#nDue").textContent=d?d:"";
}
$("#sMarkers").onclick=()=>toast(S.unlimited?"Unlimited markers are on. Change it in You, Settings.":S.markers>=MAXM?"Markers full. A miss in a lesson uses one.":`${S.markers} of ${MAXM} markers. Next one in ${nextMarkerMin()} min, or finish a drill round for two.`);
let TAB="path";
$("#sHelp").onclick=()=>openGlossary(); $("#sGear").onclick=()=>openSettings();
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){ applyTextSize(); checkBadges(); renderTray(); ({path:renderPath,review:renderDrill,board:renderBoard,manual:renderManual,group:renderGroup,you:renderYou})[TAB]() }

/* ---------- Path ---------- */
function nextSkill(){const sc=ORDER.filter(inScope);return sc.find(id=>(S.lv[id]||0)<1)||sc.slice().sort((a,b)=>(S.lv[a]||0)-(S.lv[b]||0))[0]}
function lvRing(lv){const r=37,c=2*Math.PI*r,f=lv/MAXLV;return `<svg class="lv" viewBox="0 0 82 82"><circle cx="41" cy="41" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="41" cy="41" r="${r}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*f} ${c}"/></svg>`}
function countdown(){
  if(!S.examDate) return "Pick a skill or clear your drill queue.";
  const d=diffDays(dayKey(),S.examDate);
  return d>0?`T minus ${d} day${d===1?"":"s"} to your board.`:d===0?"Board day. Name the method first.":"Your board date has passed. Update it in You, Settings.";
}
function renderPath(){
  const t=dayKey(), today=S.xpDays[t]||0, f=Math.min(1,today/S.goal), days=[...Array(7)].map((_,i)=>addDays(t,i-6));
  const r=26,c=2*Math.PI*r, nx=nextSkill(), dc=due().length, qd=S.quests[t]||{};
  let h=noticeHTML()+boardDayHTML()+deltaHTML()+`<section class="today">
    <div class="ring"><svg width="66" height="66" viewBox="0 0 66 66"><circle cx="33" cy="33" r="${r}" fill="none" stroke="rgba(236,234,248,.2)" stroke-width="7"/><circle cx="33" cy="33" r="${r}" fill="none" stroke="var(--peri)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*f} ${c}"/></svg><span>${today}/${S.goal}</span></div>
    <div><h2>${today>=S.goal?"Daily goal met":"Today's board time"}</h2><p>${liveStreak()?liveStreak()+" day streak. ":""}${countdown()}</p>
      <div class="week">${days.map(k=>`<span class="${k===t?"now":""}"><i class="${(S.xpDays[k]||0)>0?"on":""}"></i>${"MTWTFSS"[(new Date(k+"T12:00").getDay()+6)%7]}</span>`).join("")}</div></div>
    <div class="cta"><button class="btn" id="goNext">${(()=>{const it=nextPlanItem();return it?"Next: "+esc(it.label):((S.lv[nx]||0)?"Continue":"Start")+": "+esc(SKILL[nx].name)})()}</button>${dc?`<button class="btn ghost" id="goRev">Drill ${dc} due</button>`:""}</div>
  </section>

let L=null;
function pickLesson(id){
  const qs=QBY[id]||[]; const lv=S.lv[id]||0;
  const score=q=>{const c=S.cards[q.id];if(!c)return Math.random()+(lv===0&&q.type==="num"?2:0)+(lv===0&&q.type==="mc"?-0.5:0);return 2+c.b-c.m*.5+Math.random()*.6};
  const pool=qs.slice().sort((a,b)=>score(a)-score(b));
  let pick=pool.slice(0,LESSON_N);
  if(lv===0){const easy=pick.filter(q=>q.type!=="num");pick=shuffle(easy).concat(pick.filter(q=>q.type==="num"))}
  else pick=shuffle(pick);
  return pick;
}
const markersOn=id=>!S.unlimited&&(S.lessons||0)>=3&&(S.lv[id]||0)>=1;

function startDrill(skillFilter){
  let ids=due(); if(skillFilter) ids=ids.filter(x=>QID[x].skill===skillFilter);
  if(!ids.length){ids=Object.keys(S.cards).filter(id=>QID[id]&&inScope(QID[id].skill)&&(!skillFilter||QID[id].skill===skillFilter)).sort((a,b)=>(S.cards[a].b-S.cards[a].m)-(S.cards[b].b-S.cards[b].m))}
  if(!ids.length){toast("Finish a lesson first. Every question you see comes back here.");return}
  newSession({mode:"drill",queue:shuffle(ids.slice(0,30)).slice(0,10).map(x=>QID[x])});
}
function startCheckpoint(u){
  const sk=UNIT[u].skills; let q=[];
  sk.forEach(id=>q=q.concat(shuffle(QBY[id]).slice(0,Math.ceil(CP_N/sk.length)+1)));
  newSession({mode:"checkpoint",unit:u,queue:shuffle(q).slice(0,CP_N),requeue:false});

function startLightning(){

  const seen=pool.filter(q=>S.cards[q.id]); const st=startedSkills(); const near=pool.filter(q=>st.has(q.skill)); const base=seen.length>=30?seen:near.length>=20?near:pool;

function logBoard(skill,v){const xp={solid:10,partial:6,missed:3}[v];award(xp);S.boards.unshift({skill,v,d:dayKey()});S.boards=S.boards.slice(0,60);questTick("board");save();postLeague();renderTray();return xp}
function selfGrade(out,b,cb){

async function gradeOne(){

function handleSampleErr(e,fallback){
  if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){sampleFn=null;toast("Claude grading is off for this view. Grade against the key.");fallback();return}
  if(e&&e.code==="cancelled") return;

}

async function finishMock(){
  clearInterval(mockTimer); M.t1=Date.now();

}

/* ================= v3: plan, formulas, flashcards, derivations, examiner, duels ================= */
const DERIVS=CONTENT.derivs||[], DBY={}; DERIVS.forEach(d=>(DBY[d.skill] ||= []).push(d));
const FORMS=CONTENT.formulas||[], FMBY={}; FORMS.forEach((f,i)=>{f.k=f.skill+"|"+i;(FMBY[f.skill] ||= []).push(f)});
const DID={}; DERIVS.forEach(d=>DID[d.id]=d);

/* ---------- Adaptive plan ---------- */
function planItems(){
  const items=bookingPlanItems(); const sc=ORDER.filter(inScope); const d=due().length;
  const left=S.examDate?diffDays(dayKey(),S.examDate):null;
  const need=sc.reduce((a,id)=>a+Math.max(0,3-(S.lv[id]||0)),0);
  if(left!==null&&left>=0&&left<=1){
    if(d) items.push({k:"drill",label:"A short drill round",sub:"Keep it light: ten questions",act:()=>startDrill()});
    items.push({k:"flash",label:"Ten formula flashcards",sub:"Then stop and rest",act:()=>startFlash()});
    const wd=DERIVS.filter(x=>inScope(x.skill)&&S.derivs[x.id]&&S.derivs[x.id].ok)[0]||DERIVS.find(x=>inScope(x.skill));
    if(wd) items.push({k:"deriv",label:`Walk through: ${wd.title}`,sub:"One you know, out loud, for confidence",act:()=>openDeriv(wd.id,"walk")});
    items.push({k:"play",label:"Read the board playbook aloud",sub:"Ten habits, two minutes",act:()=>setTab("board")});
    return items;
  }
  let nLessons=left&&left>0?Math.min(left<=3?1:5,Math.max(1,Math.ceil(need/left))):2;
  const bd=boardDue().length; if(bd) items.push({k:"bdeck",label:"Oral questions due",sub:`${bd} board prompt${bd>1?"s":""} back on your review ladder`,act:()=>{boardSkill=null;pickBoard();setTab("board")}});
  if(d) items.push({k:"drill",label:`Clear your drill queue`,sub:`${d} due, about ${Math.ceil(d/10)*3} min`,act:()=>startDrill()});
  const nx=nextSkill(); const low=[nx].concat(sc.filter(id=>id!==nx).sort((a,b)=>((S.lv[a]||0)-(S.lv[b]||0))||(ORDER.indexOf(a)-ORDER.indexOf(b)))).slice(0,nLessons);
  low.forEach(id=>items.push({k:"lesson",id,label:`Lesson: ${SKILL[id].name}`,sub:`${SKILL[id].cn}, level ${S.lv[id]||0} of ${MAXLV}`,act:()=>startLesson(id)}));
  const weak=sc.map(id=>({id,a:skillAcc(id)})).filter(x=>x.a).sort((a,b)=>a.a.acc-b.a.acc)[0];
  const dsk=(weak&&DBY[weak.id])?weak.id:low.find(id=>DBY[id]);
  if(dsk){const dv=DBY[dsk][0];items.push({k:"deriv",id:dv.id,label:`Derivation: ${dv.title}`,sub:"Rebuild it step by step, then say it out loud",act:()=>openDeriv(dv.id,"build")})}
  if((S.lessons||0)>=2){const sl=EXAMS.filter(e=>S.exams.includes(e.id)).flatMap(e=>UNIT[e.id==="SDO"?"u10":"u11"].skills).sort((a,b)=>(S.lv[a]||0)-(S.lv[b]||0))[0];if(sl&&!low.includes(sl))items.push({k:"lesson",id:sl,label:`Lesson: ${SKILL[sl].name}`,sub:"The slips past candidates made most often",act:()=>startLesson(sl)})}
  {const lp=ladPool();if(lp.length){const ll=lp[hash(dayKey()+"lad")%lp.length];items.push({k:"lad",id:ll.id,label:`Oral ladder: ${ll.title}`,sub:`${ll.chair}, ${ll.rungs.length} rungs out loud`,act:()=>openLadder(ll.id)})}}
  const psk=(weak&&PBY[weak.id])?weak.id:low.find(id=>PBY[id]);
  if(psk){const pl=PBY[psk]||[];const pp=pl[hash(dayKey()+psk)%pl.length];pp&&items.push({k:"prob",id:pp.id,label:`Board problem: ${pp.title}`,sub:`${pp.parts.length} parts, about ${pp.parts.length*4} min`,act:()=>openProblem(pp.id)})}
  const lastMock=S.mocks[0]?diffDays(S.mocks[0].d,dayKey()):99;
  if(left!==null&&left<=21&&lastMock>=3) items.push({k:"mock",label:"Full mock board",sub:`${left} day${left===1?"":"s"} out. Three chairs, about 25 min`,act:()=>{setTab("board");startMock(S.exams[0])}});
  else if(sampleFn) items.push({k:"exam",label:"Live examiner round",sub:"Claude asks, then follows up four times",act:()=>{setTab("board");startExaminer()}});
  else items.push({k:"bdeck",label:"One oral board question",sub:"Answer out loud, then check the key",act:()=>{boardSkill=null;pickBoard();setTab("board");setTimeout(()=>{const a=$("#bAns");if(a){a.scrollIntoView({block:"center"});a.focus({preventScroll:true})}},60)}});
  {const md=memDue().length;if(memPool().length)items.push({k:"mem",label:"Ten memory questions",sub:md?`${md} due back, recall each cold`:"Lists and conventions to have cold at the board",act:()=>startMem()})}
  {const sd=sketchDueCount();if(sketchPool().length&&(sd||(S.lessons||0)>=1))items.push({k:"sketch",label:"Sketch a figure from memory",sub:sd?`${sd} figure${sd>1?"s":""} due back`:"Draw it cold, then compare with the reference",act:()=>startSketch()})}
  items.push({k:"flash",label:"Formula flashcards",sub:"Ten equations to write cold",act:()=>startFlash()});
  return items;

let DV=null;
function openDeriv(id,mode){
  const d=DID[id]; DV={d,mode,seq:[],order:shuffle(d.steps.map((s,i)=>i)),checked:false,ok:false,rev:0};
  if(mode==="build"){let tries=0;while(DV.order.every((v,i)=>v===i)&&tries++<5)DV.order=shuffle(DV.order)}
  document.body.style.overflow="hidden"; drawDeriv();
}
function drawDeriv(){
  const d=DV.d, sk=SKILL[d.skill];
  let body=`<div class="kind"><span class="tag">${DV.mode==="build"?"Build the derivation":"Walk the derivation"}</span><span class="pill">${sk.cn} · ${esc(sk.name)}</span></div>

  let foot="";

    body+=`<span class="label">Tap the steps in order</span><div class="slot" id="dSlot">${DV.seq.map((i,n)=>`<button class="chip" data-i="${i}"><span class="num">${n+1}</span>${esc(d.steps[i].s)}</button>`).join("")}</div>

    foot=`<div class="row"><button class="btn" id="dCheck" ${DV.seq.length===d.steps.length?"":"disabled"}>Check order</button></div>`;
  } else if(DV.mode==="walk"&&DV.rev<d.steps.length){
    body+=`<ol class="steps">${d.steps.slice(0,DV.rev).map(s=>`<li><span class="eqs">${esc(s.s)}</span><span class="why">${esc(s.why)}</span></li>`).join("")}</ol><p class="muted">Say step ${DV.rev+1} out loud, then reveal it.</p>`;
    foot=`<div class="row"><button class="btn" id="dNext">Reveal step ${DV.rev+1} of ${d.steps.length}</button></div>`;
  } else {
    const mark=DV.mode==="build";
    body+=`${mark?`<div class="verdict" style="color:var(--${DV.ok?"good":"bad"})">${DV.ok?"Every step in order.":"Here is the board order."}</div>`:""}
     <ol class="steps">${d.steps.map((s,i)=>`<li class="${mark?(DV.seq[i]===i?"ok":"no"):""}"><span class="eqs">${esc(s.s)}</span><span class="why">${esc(s.why)}</span></li>`).join("")}</ol>
     <div class="grade"><span class="label">Result</span><div class="eq">${esc(d.result)}</div><span class="label">Check it</span><ul class="facts">${d.checks.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`;
    foot=`<div class="row"><button class="btn" id="dDone">Continue</button>${mark?`<button class="btn ghost" id="dWalk">Walk it through</button>`:`<button class="btn ghost" id="dBuild">Build it from scratch</button>`}</div>`;
  }
  $("#layer").innerHTML=`<div class="board" role="dialog" aria-modal="true" aria-label="Derivation"><div class="b-top"><button class="x" id="dQuit" aria-label="Quit">${ICON.x}</button><div class="bar"><i style="width:${DV.mode==="walk"?100*DV.rev/d.steps.length:100*DV.seq.length/d.steps.length}%"></i></div></div>
    <div class="b-body">${body}</div><div class="b-foot"><div class="inner">${foot}</div></div></div>`;
  $("#dQuit").onclick=()=>{DV=null;closeLayer();render()};
  document.querySelectorAll("#dSlot .chip").forEach(c=>c.onclick=()=>{DV.seq.splice(DV.seq.indexOf(+c.dataset.i),1);drawDeriv()});
  document.querySelectorAll("[data-p]").forEach(c=>c.onclick=()=>{const i=+c.dataset.p;if(!DV.seq.includes(i)){DV.seq.push(i);drawDeriv()}});
  const ck=$("#dCheck"); ck&&(ck.onclick=()=>{DV.checked=true;DV.ok=DV.seq.every((v,i)=>v===i);const r=S.derivs[d.id]||{n:0,ok:0};r.n++;r.d=dayKey();if(DV.ok)r.ok++;S.derivs[d.id]=r;award(DV.ok?8:3);save();postLeague();drawDeriv()});
  const nx=$("#dNext"); nx&&(nx.onclick=()=>{DV.rev++;if(DV.rev>=d.steps.length){award(4);const r=S.derivs[d.id]||{n:0,ok:0};r.w=(r.w||0)+1;r.d=dayKey();S.derivs[d.id]=r;save()}drawDeriv()});nx&&nx.focus();
  const dn=$("#dDone"); dn&&(dn.onclick=()=>{DV=null;closeLayer();render()});
  const w=$("#dWalk"); w&&(w.onclick=()=>openDeriv(d.id,"walk"));

}

}
function exRules(b){return `You are an aerospace PhD qualifying exam examiner running an oral board on: ${SKILL[b.skill].name} (${SKILL[b.skill].cn}).
You opened with: "${b.prompt}"
Private key points a full answer covers (do not list them to the student):
${b.points.map((p,i)=>(i+1)+". "+p).join("\n")}

const DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDay(ms){const d=new Date(ms);const t=dayKey(), k=dayKey(d);return k===t?"Today":k===addDays(t,1)?"Tomorrow":`${DAYN[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`}
function fmtTime(ms){const d=new Date(ms);let h=d.getHours(),m=d.getMinutes();const ap=h>=12?"pm":"am";h=h%12||12;return h+(m?":"+pad(m):"")+" "+ap}

function needNames(ids){ids=ids.filter(i=>i&&i!==uid&&!(i in names));if(!ids.length||!userNS)return;ids.forEach(i=>names[i]="");userNS.profiles(ids.slice(0,64)).then(ps=>{for(const i of ids)names[i]=(ps&&ps[i]&&ps[i].name)||"";if(TAB==="group"&&!KIT&&!$("#layer .scrim"))renderGroup()}).catch(()=>{})}

function calLinks(s){

/* ---------- Examiner kit ---------- */
function openKit(s){
  const cand=s.type==="mock"?s.host:(people(s).find(p=>p.role==="candidate")||{}).id;
  const ex=s.exam==="Both"?EXAMS.find(e=>e.id===S.exams[0]):EXAMS.find(e=>e.id===s.exam);
  const used=new Set();
  KIT={s,cand,exam:ex.id,chairs:ex.chairs.map(([c,skills])=>{const b=shuffle(BOARDS.filter(x=>skills.includes(x.skill)&&!used.has(x)))[0];used.add(b);return {c,skills,b,got:new Set(),score:null,note:""}}),note:"",t0:Date.now()};
  setTab("group");
}
function renderKit(){
  const s=KIT.s;

   <div class="grade"><span class="label">Run it like the real board</span><ul class="facts"><li>Draw the figure yourself and let them pick the method.</li><li>Stay quiet until they name the method; follow up one rung at a time.</li><li>About eight minutes per chair, then move on.</li></ul></div>`;

let AC=null;
function sfx(kind){
  if(!S.sound) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
    const notes={ok:[660,880],no:[220,180],done:[523,659,784,1047],goal:[784,988,1175]}[kind]||[440];
    notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;const t=AC.currentTime+i*0.09;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+0.2)});
  }catch(e){}
}
function hintFor(q){
  const fs=FMBY[q.skill]||[]; if(!fs.length) return null;
  const words=s=>new Set(String(s).toLowerCase().match(/[a-zα-ωσεφλμνθγΓΔ_]{2,}/gi)||[]);
  const qw=words(q.q+" "+(q.text||"")+" "+(q.a||""));
  let best=null,bs=-1; for(const f of fs){const fw=words(f.name+" "+f.eq+" "+f.use);let s=0;fw.forEach(w=>{if(qw.has(w))s++});if(s>bs){bs=s;best=f}}
  const need=(q.type==="num"||q.type==="cloze")?1:3;
  return bs>=need?best:null;
}

    <div class="field"><label class="label" for="auQ">Question</label><textarea id="auQ" style="min-height:70px" placeholder="Give every number and convention the answer needs."></textarea></div>
    <div class="field" id="auTextW" hidden><label class="label" for="auText">Statement with one ___ blank</label><input id="auText" class="search" placeholder="For example: P_cr = ___ EI/L² for a pinned-pinned column"></div>
    <div class="field"><label class="label" for="auA">Correct answer</label><input id="auA" class="search"></div>
    <div class="field" id="auUW" hidden><label class="label" for="auU">Unit (numeric only)</label><input id="auU" class="search" placeholder="MPa"></div>
    <div class="field" id="auWW"><span class="label">Three wrong options</span><input id="auW1" class="search"><input id="auW2" class="search"><input id="auW3" class="search"></div>
    <div class="field"><label class="label" for="auX">Explanation</label><textarea id="auX" style="min-height:70px" placeholder="State the correct fact only, in positive form."></textarea><span class="note">Write only correct statements here; leave the wrong options unmentioned, so passive review encodes the right version.</span></div>
    ${note?`<p class="note" style="margin:0">${esc(note)}</p>`:""}
    <p class="note" id="auErr" style="color:var(--bad)" hidden></p>
    <div class="row"><button class="btn" type="submit">Submit</button></div></form>`);
  let type="mc"; const Lr=$("#layer");
  Lr.querySelectorAll("#auT button").forEach(b=>b.onclick=()=>{type=b.dataset.v;Lr.querySelectorAll("#auT button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#auTextW").hidden=type!=="cloze";$("#auUW").hidden=type!=="num";$("#auWW").hidden=type==="num"});
  $("#auF").onsubmit=async e=>{e.preventDefault();const g=id=>$(id).value.trim().replace(/[\u2014\u2013]/g,", ");
    const q={id:"c-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),skill:$("#auSk").value,type,q:g("#auQ"),x:g("#auX")};
    if(type==="num"){q.a=parseNum(g("#auA"));q.tol=0.02;q.unit=g("#auU")}else{q.a=g("#auA");q.w=[g("#auW1"),g("#auW2"),g("#auW3")]}
    if(type==="cloze"){q.text=g("#auText")}
    const err=$("#auErr");
    if(type!=="num"&&q.w.some(w=>!w)){err.textContent="Add all three wrong options.";err.hidden=false;return}
    if(!validQ(q)){err.textContent=type==="cloze"?"The statement needs exactly one ___ and every field filled in.":type==="num"?"The answer must be a number, and the question and explanation are required.":"Fill in the question, answer and explanation.";err.hidden=false;return}
    if(/\b(not|never|cannot)\b|n't/i.test(q.x)){err.textContent="Rephrase the explanation as a positive statement of the correct fact.";err.hidden=false;return}
    try{await onSubmit(q);closeLayer()}catch(e2){err.textContent="That didn't save. Check your connection and try again.";err.hidden=false}
  };

/* ---------- Cheat sheet ---------- */
function cheatSheet(ex){
  const ids=ORDER.filter(id=>SKILL[id].exam===ex);
  const weakSk=ids.map(id=>({id,m:skillMastery(id),a:skillAcc(id)})).sort((a,b)=>(a.a?a.a.acc:1)-(b.a?b.a.acc:1)||a.m-b.m).slice(0,8).map(x=>x.id);
  const missed=[...new Set((S.errs||[]).map(e=>e.q).concat(Object.entries(S.cards).filter(([id,c])=>c.m>0).map(([id])=>id)))].filter(id=>QID[id]&&SKILL[QID[id].skill].exam===ex).slice(0,40);
  const cs=x=>String(x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const sec=weakSk.map(id=>`<section><h2>${cs(SKILL[id].cn)} · ${cs(SKILL[id].name)}</h2>${(FMBY[id]||[]).map(f=>`<div class="f"><b>${cs(f.name)}</b><div class="eq">${MX.fmt(f.eq,"display")}</div><small>${cs(f.where)}</small></div>`).join("")}${(DBY[id]||[]).map(d=>`<div class="f"><b>Derivation: ${cs(d.title)}</b><div class="eq">${MX.fmt(d.result,"display")}</div></div>`).join("")}</section>`).join("");
  const facts=missed.map(id=>`<li><span>${cs(tagOf(QID[id].skill))}</span> ${MX.fmt(QID[id].x,"inline")}</li>`).join("");
  return `<!doctype html><html><head><meta charset="utf-8"><title>Quals cheat sheet ${ex}</title><style>
body{font:11pt/1.4 Georgia,serif;color:#0B1F33;max-width:7.5in;margin:.5in auto;padding:0 .2in}h1{font:600 20pt Georgia,serif;margin:0 0 4pt}p.meta{font:9pt system-ui,sans-serif;color:#57527A;margin:0 0 12pt}
h2{font:700 9pt system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#003057;border-bottom:1.5px solid #B3A369;padding-bottom:3pt;margin:14pt 0 6pt}
.f{break-inside:avoid;margin:0 0 6pt}.f b{font:600 9pt system-ui,sans-serif}.eq{font-size:12pt;margin:1pt 0}small{font:8pt system-ui,sans-serif;color:#57527A}
section{columns:2;column-gap:.3in}section h2{column-span:all}ul{padding-left:14pt}li{margin:0 0 4pt;break-inside:avoid}li span{font:700 7pt system-ui,sans-serif;color:#857437}
.eq{font-family:"STIX Two Text",Cambria,"Times New Roman",serif}.eq i{font-style:italic}.eql{display:block}sub,sup{font-size:.72em;line-height:0}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.15}.frac>.fn{border-bottom:1px solid}.rad{white-space:nowrap}.rad .ro{border-top:1px solid}.mat{display:inline-grid;gap:0 .7em;padding:0 .4em;border-left:1px solid;border-right:1px solid}.bigop{font-size:1.25em}

/* ================= v8: board problems, road to board day, board-day card, backup, text size ================= */
const PROBS=CONTENT.problems||[], PBY={}, PID={}; PROBS.forEach(p=>{(PBY[p.skill] ||= []).push(p);PID[p.id]=p});
let PR=null, prTimer=null;
function probPool(){return PROBS.filter(p=>inScope(p.skill))}
function nextProblem(skill){
  let pool=probPool().filter(p=>!skill||p.skill===skill);
  const unseen=pool.filter(p=>!(S.probs||{})[p.id]);
  const pick=(unseen.length?unseen:pool.sort((a,b)=>((S.probs[a.id]||{}).best||0)-((S.probs[b.id]||{}).best||0)).slice(0,6));
  return pick[Math.floor(Math.random()*pick.length)];
}
function checkable(p){return p.parts.filter(x=>x.type!=="say").length}
function openProblem(id){
  const p=PID[id]; if(!p) return;
  PR={p,i:0,res:[],t0:Date.now(),state:"ask",said:false};
  document.body.style.overflow="hidden"; drawProblem();
  clearInterval(prTimer); prTimer=setInterval(()=>{const c=$("#prClock");if(!c||!PR){clearInterval(prTimer);return}const s=Math.floor((Date.now()-PR.t0)/1000), tgt=PR.p.parts.length*240;c.textContent=Math.floor(s/60)+":"+pad(s%60);c.classList.toggle("warn",s>tgt)},1000);
}
function partAnswer(pt){return pt.type==="num"?fmtNum(pt.a)+(pt.unit?" "+pt.unit:""):pt.a}
function drawProblem(){
  const p=PR.p, sk=SKILL[p.skill];
  if(PR.i>=p.parts.length) return finishProblem();
  const pt=p.parts[PR.i];
  let h=`<div class="kind"><span class="tag">Board problem</span><span class="pill">${sk.cn} · ${esc(sk.name)}</span><span class="pill">Part ${PR.i+1} of ${p.parts.length}</span></div>
   <div class="prompt" style="font-size:22px">${esc(p.title)}</div><div class="grade"><span class="label">The examiner draws</span>${PFIG[p.id]?`<div class="svgw boardfig">${PFIG[p.id]}</div>`:""}<p style="margin:0">${esc(p.setup)}</p></div>`;
  PR.res.slice(0,PR.i).forEach((r,j)=>{const q=p.parts[j];h+=`<details class="done-part"><summary><span class="pill" style="border-color:var(--${r===true?"good":r===false?"bad":"line"})">${String.fromCharCode(97+j)}</span> ${esc(q.ask)}</summary><p class="ans" style="margin:6px 0 0">${esc(partAnswer(q))}</p></details>`});
  h+=`<div class="part"><span class="label">Part ${String.fromCharCode(97+PR.i)}</span><p class="pask">${esc(pt.ask)}</p>`;
  if(PR.state==="ask"){
    if(pt.type==="num") h+=`<div class="numrow"><input id="prIn" inputmode="decimal" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><span class="unit">${esc(pt.unit||"")}</span></div>`;
    else if(pt.type==="mc") h+=`<div class="opts">${shuffle([pt.a,...pt.w]).map((o,k)=>`<button class="opt" data-v="${esc(o)}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    else h+=`<textarea id="prSay" placeholder="Say it out loud or type it, then reveal the model answer."></textarea>`;
  } else {
    const r=PR.res[PR.i];
    h+=pt.type==="say"?`<div class="grade"><span class="label">Model answer</span><p style="margin:0">${esc(pt.a)}</p></div>`:`<div class="verdict" style="color:var(--${r?"good":"bad"})">${r?"Correct.":"Here is the board answer."}</div>${pt.type==="num"&&PR.typed&&PR.typed[PR.i]?`<p class="note" style="margin:0">You entered ${esc(PR.typed[PR.i].replace(/-/g,"\u2212"))} ${esc(pt.unit||"")}</p>`:""}<p class="ans" style="margin:0">Answer: ${esc(partAnswer(pt))}</p>`;
    h+=`<ol class="steps">${pt.sol.map(s=>`<li><span class="eqs">${esc(s)}</span></li>`).join("")}</ol>`;
  }
  h+=`</div>`;
  let foot="";
  if(PR.state==="ask") foot=pt.type==="say"?`<div class="row"><button class="btn" id="prReveal">Reveal model answer</button></div>`:`<div class="row"><button class="btn" id="prCheck" disabled>Check</button><button class="btn ghost small" id="prSkip">Show solution</button></div>`;
  else if(pt.type==="say"&&PR.res[PR.i]===undefined) foot=`<span class="label">Did your answer cover it?</span><div class="row"><button class="btn good" id="prYes">I had it</button><button class="btn bad" id="prNo">Not quite</button></div>`;
  else foot=`<div class="row"><button class="btn" id="prNext">${PR.i<p.parts.length-1?"Next part":"Finish"}</button></div>`;
  $("#layer").innerHTML=`<div class="board" role="dialog" aria-modal="true" aria-label="Board problem"><div class="b-top"><button class="x" id="prQuit" aria-label="Quit">${ICON.x}</button><div class="bar"><i style="width:${100*PR.i/p.parts.length}%"></i></div><span class="clock" id="prClock">0:00</span></div>
   <div class="b-body" id="prBody">${h}</div><div class="b-foot"><div class="inner">${foot}</div></div></div>`;
  $("#prQuit").onclick=()=>{ if(PR.i===0&&PR.state==="ask"){clearInterval(prTimer);PR=null;closeLayer();render();return}
    const ft=document.querySelector("#layer .b-foot .inner"); ft.innerHTML=`<p style="margin:0">Leave this problem? Parts you finished are not saved.</p><div class="row"><button class="btn bad" id="prLeave">Leave</button><button class="btn ghost" id="prStay">Keep going</button></div>`;
    $("#prLeave").onclick=()=>{clearInterval(prTimer);PR=null;closeLayer();render()}; $("#prStay").onclick=()=>drawProblem(); $("#prStay").focus()};
  let picked=null; const ck=$("#prCheck");
  const inp=$("#prIn"); if(inp){inp.focus();const hintEl=document.createElement("p");hintEl.className="note numhint";hintEl.style.margin="4px 0 0";inp.closest(".numrow").after(hintEl);inp.oninput=()=>{const bad=isNaN(parseNum(inp.value));ck.disabled=bad;hintEl.textContent=bad&&inp.value.trim()?"Enter a number, for example 0.227, 5/22 or 1.2e5.":""};inp.onkeydown=e=>{if(e.key==="Enter"&&!ck.disabled)ck.click()}}

/* ---------- Road to board day ---------- */
function roadmap(){
  if(!S.examDate) return null; const left=diffDays(dayKey(),S.examDate); if(left<4) return null;
  const units=EXAMS.filter(e=>S.exams.includes(e.id)).flatMap(e=>e.units).map(u=>Object.assign({},u,{m:u.skills.reduce((a,id)=>a+skillMastery(id),0)/u.skills.length})).sort((a,b)=>a.m-b.m);
  const weeks=Math.max(1,Math.ceil(left/7)); const study=Math.max(1,weeks-1); const rows=[];
  for(let w=0;w<weeks;w++){
    const start=addDays(dayKey(),w*7); const d=new Date(start+"T12:00");
    const label=w===0?"This week":`Week of ${DAYN[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
    if(w===weeks-1&&weeks>1){rows.push({label,items:["Two full mock boards with classmates","Formula flashcards and derivation walk-throughs daily","Board playbook out loud; light review the last day"],last:true});continue}
    const per=Math.ceil(units.length/study); const mine=units.slice((w%study)*per,(w%study)*per+per);
    const items=[]; if(mine.length) items.push("Units: "+mine.map(u=>u.cn+" "+u.name).join("; ")+", lessons then the checkpoint");
    items.push(left-w*7<=35?"One mock board, then one examining slot for a classmate":"Two live examiner rounds on the week's units");
    items.push("Daily drill queue and two derivations");
    rows.push({label,items});
  }
  return {left,rows};
}

  const r=roadmap(); if(!r) return "";

/* ---------- Checklist grading (offline) ---------- */
const STOPW=new Set("that this with from into when then than they them their there which while where what about also each have been being more most only over such some very your will would shall should could under between because using used gives give given".split(" "));
function pointTokens(p){
  const low=p.toLowerCase();
  const words=(low.match(/[a-z]{4,}/g)||[]).filter(w=>!STOPW.has(w));
  const sym=(p.match(/[^\sA-Za-z0-9.,;:()]+|\d+(?:\.\d+)?/g)||[]).filter(x=>x.length>=1&&!/^[−\-=+·×/]$/.test(x));
  return [...new Set(words.map(w=>w.slice(0,6)).concat(sym))];
}
function pointHit(p,ans){
  const a=ans.toLowerCase(); const tk=pointTokens(p); if(!tk.length||a.length<12) return false;
  const hit=tk.filter(t=>a.includes(t.toLowerCase())).length; return hit/tk.length>=0.5;
}
function checklistHTML(b,ans,key){
  const pre=b.points.map(p=>pointHit(p,ans||""));
  return `<div class="cklist" data-ck="${key}"><span class="label">Tick each point your answer made</span>${b.points.map((p,i)=>`<label class="ck"><input type="checkbox" ${pre[i]?"checked":""} data-i="${i}"><span>${esc(p)}</span></label>`).join("")}
   ${pre.some(Boolean)?`<p class="note" style="margin:0">Points that match words in your answer start ticked. Adjust them honestly.</p>`:""}
   <div class="row"><button class="btn" data-score="${key}">Score my answer</button></div></div>`;
}

const DELTA_LINES={
  goalMet:["Fine. Goal met. I will stop circling your building. For now.","Acceptable. Do not let it go to your head.","Good. The board is still coming, but so are you.","You did the work. I am almost impressed. Almost.","Goal met. I am cancelling the flyover I had planned.","Today is logged. Tomorrow I will be back on your six.","Nice. Your examiners just felt a chill and do not know why.","That will do. Go hydrate. Then come back tomorrow."],

  endGood:["Clean board. The examiners would be bored. Good.","That is how you hold a rung. Do it again tomorrow.","Smooth. Like a well placed static margin.","Textbook. I will allow it.","That landing was a greaser. Keep that energy."],

  endBad:["That round stalled. Lower your α and try again.","The examiner wrote that down. So did I.","Rough. Review it now, before it reviews you.","Every miss comes back tomorrow. So do I.","We are going around. Full power, try again."]
};
const pickLine=(k,seed)=>{const a=DELTA_LINES[k];return a[(seed==null?Math.floor(Math.random()*a.length):seed)%a.length]};
function deltaState(){
  const t=dayKey(), today=S.xpDays[t]||0, h=new Date().getHours();
  const lost=!liveStreak()&&S.best>0&&!today;
  if(today>=S.goal) return ["smug",pickLine("goalMet",hash(t))];
  if(lost) return ["furious",pickLine("lost",hash(t))];
  if(!S.lessons) return ["stern",pickLine("fresh",hash(t))];
  if(h>=22||h<4) return ["furious",pickLine("night",hash(t))];
  if(h>=17) return ["glare",pickLine("evening",hash(t))];
  if(h>=12) return ["stern",pickLine("afternoon",hash(t))];
  return ["stern",pickLine("morning",hash(t))];
}
